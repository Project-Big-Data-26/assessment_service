<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
<rect width="3840" height="2160" fill="#f4f7fc"/>
<text x="100" y="137" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="72" font-weight="700" fill="#132d49">VALIDASI EMPIRIS: DELIVERY, CTT / IRT, DAN REVIEW AHLI</text>
<text x="100" y="206" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="36" font-weight="400" fill="#4a6078">Backend tersedia • data siswa nyata tetap diperlukan • version / population / grade tidak dicampur</text>
<rect x="100" y="300" width="1160" height="450" rx="24" fill="#ffffff" stroke="#157566" stroke-width="3"/>
<text x="136" y="365" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="43" font-weight="700" fill="#157566">01  GOLD DAN BLUEPRINT</text>
<text x="136" y="431" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Human-gold snapshot + checksum.</text>
<text x="136" y="478" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Kunci/solusi dan versi terverifikasi.</text>
<text x="136" y="525" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Fixed form, satu grade/populasi.</text>
<text x="136" y="572" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Silver / research tidak boleh delivery.</text>
<rect x="1340" y="300" width="1160" height="450" rx="24" fill="#ffffff" stroke="#2468a0" stroke-width="3"/>
<text x="1376" y="365" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="43" font-weight="700" fill="#2468a0">02  DELIVERY IMMUTABLE</text>
<text x="1376" y="431" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Participant Bearer terikat assessment.</text>
<text x="1376" y="478" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Opsi diacak, public IDs opaque.</text>
<text x="1376" y="525" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Refresh memakai snapshot yang sama.</text>
<text x="1376" y="572" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Key / solution tidak masuk DTO siswa.</text>
<rect x="2580" y="300" width="1160" height="450" rx="24" fill="#ffffff" stroke="#2468a0" stroke-width="3"/>
<text x="2616" y="365" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="43" font-weight="700" fill="#2468a0">03  RESPONS SERVER</text>
<text x="2616" y="431" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Benar = 1; salah = 0; skip = NA.</text>
<text x="2616" y="478" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Identity, version, scoring dari server.</text>
<text x="2616" y="525" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Event immutable; retry tanpa duplikasi.</text>
<text x="2616" y="572" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Server timing dan anomaly flags.</text>
<rect x="2580" y="850" width="1160" height="450" rx="24" fill="#ffffff" stroke="#2468a0" stroke-width="3"/>
<text x="2616" y="915" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="43" font-weight="700" fill="#2468a0">04  CLEANING DAN MATRIKS</text>
<text x="2616" y="981" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Satu completed attempt per subject.</text>
<text x="2616" y="1028" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">First / last; completion time window.</text>
<text x="2616" y="1075" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Exclude mismatch, invalid, rapid guess.</text>
<text x="2616" y="1122" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Missing tetap NA, tanpa imputasi nol.</text>
<rect x="1340" y="850" width="1160" height="450" rx="24" fill="#ffffff" stroke="#a06515" stroke-width="3"/>
<text x="1376" y="915" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="43" font-weight="700" fill="#a06515">05  CTT DAN GATE IRT</text>
<text x="1376" y="981" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">p / Wilson CI, rest-score D dan r_it.</text>
<text x="1376" y="1028" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">KR-20 menggunakan complete cases.</text>
<text x="1376" y="1075" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">N, coverage, variasi, connected design.</text>
<text x="1376" y="1122" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Review dimensi, local independence, sampling.</text>
<rect x="100" y="850" width="1160" height="450" rx="24" fill="#ffffff" stroke="#7057a3" stroke-width="3"/>
<text x="136" y="915" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="43" font-weight="700" fill="#7057a3">06  RASCH / 2PL / 3PL</text>
<text x="136" y="981" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Regularized marginal likelihood; θ~N(0,1).</text>
<text x="136" y="1028" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Gauss-Hermite; missing tanpa likelihood.</text>
<text x="136" y="1075" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">a / b / c, EAP, uncertainty, information.</text>
<text x="136" y="1122" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Convergence, bounds, infit/outfit, Q3.</text>
<text x="136" y="1169" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Gate gagal: CTT + waiting status.</text>
<rect x="100" y="1400" width="1160" height="450" rx="24" fill="#ffffff" stroke="#7057a3" stroke-width="3"/>
<text x="136" y="1465" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="43" font-weight="700" fill="#7057a3">07  SNAPSHOT ADVISORY</text>
<text x="136" y="1531" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Immutable policy / matrix / sample hashes.</text>
<text x="136" y="1578" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Populasi, family, grade, time window.</text>
<text x="136" y="1625" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">CTT / IRT tetap empirical difficulty.</text>
<text x="136" y="1672" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Disagreement hanya review flag.</text>
<text x="136" y="1719" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Research-only; bukan gold otomatis.</text>
<rect x="1340" y="1400" width="1160" height="450" rx="24" fill="#ffffff" stroke="#157566" stroke-width="3"/>
<text x="1376" y="1465" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="43" font-weight="700" fill="#157566">08  KEPUTUSAN AHLI</text>
<text x="1376" y="1531" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Authenticated expert + CSRF + rationale.</text>
<text x="1376" y="1578" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Retain / revise / quarantine append-only.</text>
<text x="1376" y="1625" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Hold delivery pada versi terkait.</text>
<text x="1376" y="1672" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Exclude held version dari freeze berikutnya.</text>
<text x="1376" y="1719" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Label awal dan histori tetap tersimpan.</text>
<rect x="2580" y="1400" width="1160" height="450" rx="24" fill="#ffffff" stroke="#157566" stroke-width="3"/>
<text x="2616" y="1465" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="43" font-weight="700" fill="#157566">09  VERSIONING / TRAINING</text>
<text x="2616" y="1531" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Revisi → versi baru → review manusia.</text>
<text x="2616" y="1578" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Freeze gold baru, group-aware split.</text>
<text x="2616" y="1625" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">IndoBERT ordinal grade-aware + calibration.</text>
<text x="2616" y="1672" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Technical gates + approval model.</text>
<text x="2616" y="1719" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Respons siswa bukan training text.</text>
