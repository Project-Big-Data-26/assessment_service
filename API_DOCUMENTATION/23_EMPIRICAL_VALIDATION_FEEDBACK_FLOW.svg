<rect x="100" y="1940" width="3640" height="130" rx="24" fill="#e6edf7" stroke="#e6edf7" stroke-width="3"/>
<text x="135" y="1994" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="36" font-weight="700" fill="#132d49">FastAPI + MongoDB gold/auth + SQLite pilot + NumPy/SciPy • API 2.1.0 • Dokumen 07 / 27</text>
<text x="135" y="2042" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="31" font-weight="400" fill="#132d49">Minimum proyek: Rasch 100×5; 2PL 300×10; 3PL 1000×20. Tidak ada pooling, auto-label, CAT atau equating.</text>
</svg>