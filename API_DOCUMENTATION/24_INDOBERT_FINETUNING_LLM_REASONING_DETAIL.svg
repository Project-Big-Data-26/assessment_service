<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
<rect width="3840" height="2160" fill="#f4f7fc"/>
<text x="100" y="137" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="72" font-weight="700" fill="#132d49">INDOBERT ORDINAL GRADE-AWARE DAN BLIND LLM N=3</text>
<text x="100" y="206" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="36" font-weight="400" fill="#4a6078">Protokol terbaru: label blind dikunci sebelum comparison; silver AI menjadi label operasional</text>
<rect x="100" y="300" width="1740" height="265" rx="24" fill="#ffffff" stroke="#2468a0" stroke-width="3"/>
<text x="136" y="365" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="43" font-weight="700" fill="#2468a0">A1  SNAPSHOT DAN SPLIT</text>
<text x="136" y="431" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Snapshot silver qualified: ai_silver.</text>
<text x="136" y="478" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Hash lock; group-aware 70/15/15; source / stimulus / duplicate family.</text>
<line x1="970" y1="575" x2="970" y2="600" stroke="#92a6bd" stroke-width="8"/>
<polygon points="970,600 954,575 986,575" fill="#92a6bd"/>
<rect x="100" y="610" width="1740" height="265" rx="24" fill="#ffffff" stroke="#2468a0" stroke-width="3"/>
<text x="136" y="675" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="43" font-weight="700" fill="#2468a0">A2  SERIALIZER DAN ENCODER</text>
<text x="136" y="741" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Stem, stimulus, metadata grade, opsi, solusi/visual terverifikasi.</text>
<text x="136" y="788" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Serializer tunggal; IndoBERT shared encoder + LoRA query/value.</text>
<line x1="970" y1="885" x2="970" y2="910" stroke="#92a6bd" stroke-width="8"/>
<polygon points="970,910 954,885 986,885" fill="#92a6bd"/>
<rect x="100" y="920" width="1740" height="265" rx="24" fill="#ffffff" stroke="#2468a0" stroke-width="3"/>
<text x="136" y="985" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="43" font-weight="700" fill="#2468a0">A3  TIGA HEAD</text>
<text x="136" y="1051" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Head 1: knowing / applying / reasoning; Head 2: empat knowledge classes.</text>
<text x="136" y="1098" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Head 3: cumulative ordinal + grade embedding + ordered cutpoints.</text>
<line x1="970" y1="1195" x2="970" y2="1220" stroke="#92a6bd" stroke-width="8"/>
<polygon points="970,1220 954,1195 986,1195" fill="#92a6bd"/>
<rect x="100" y="1230" width="1740" height="265" rx="24" fill="#ffffff" stroke="#2468a0" stroke-width="3"/>
<text x="136" y="1295" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="43" font-weight="700" fill="#2468a0">A4  LOSS DAN CALIBRATION</text>
<text x="136" y="1361" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Multiclass + ordinal loss; train-only class weights; anti-collapse.</text>
<text x="136" y="1408" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Validation temperature / confidence+entropy; per-grade bila support cukup.</text>
<line x1="970" y1="1505" x2="970" y2="1530" stroke="#92a6bd" stroke-width="8"/>
<polygon points="970,1530 954,1505 986,1505" fill="#92a6bd"/>
<rect x="100" y="1540" width="1740" height="265" rx="24" fill="#ffffff" stroke="#2468a0" stroke-width="3"/>
<text x="136" y="1605" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="43" font-weight="700" fill="#2468a0">A5  PACKAGING DAN PROMOTION</text>
<text x="136" y="1671" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Adapter / heads / tokenizer / label map / hashes / version / metrics.</text>
<text x="136" y="1718" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Silver qualification + technical evaluation gates.</text>
<rect x="2000" y="300" width="1740" height="265" rx="24" fill="#ffffff" stroke="#7057a3" stroke-width="3"/>
<text x="2036" y="365" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="43" font-weight="700" fill="#7057a3">B1  INPUT BLIND</text>
<text x="2036" y="431" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Gemini menerima soal, grade, rubrik, key / solution / image evidence.</text>
<text x="2036" y="478" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Tanpa prediksi IndoBERT, agent difficulty, vote lain atau target distribution.</text>
<line x1="2870" y1="575" x2="2870" y2="600" stroke="#92a6bd" stroke-width="8"/>
<polygon points="2870,600 2854,575 2886,575" fill="#92a6bd"/>
<rect x="2000" y="610" width="1740" height="265" rx="24" fill="#ffffff" stroke="#7057a3" stroke-width="3"/>
<text x="2036" y="675" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="43" font-weight="700" fill="#7057a3">B2  TIGA INITIAL RUNS</text>
<text x="2036" y="741" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Tiga panggilan terpisah; structured JSON dan bukti/rationale ringkas.</text>
<text x="2036" y="788" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Hidden chain-of-thought tidak disimpan; schema/error status diperiksa.</text>
<line x1="2870" y1="885" x2="2870" y2="910" stroke="#92a6bd" stroke-width="8"/>
<polygon points="2870,910 2854,885 2886,885" fill="#92a6bd"/>
<rect x="2000" y="920" width="1740" height="265" rx="24" fill="#ffffff" stroke="#7057a3" stroke-width="3"/>
<text x="2036" y="985" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="43" font-weight="700" fill="#7057a3">B3  VOTING DAN ADJUDICATION</text>
<text x="2036" y="1051" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Hanya 3–0 diterima langsung sebagai silver advisory.</text>
<text x="2036" y="1098" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">2–1, abstain, key/visual/content conflict → adjudikasi AI terpisah.</text>
<line x1="2870" y1="1195" x2="2870" y2="1220" stroke="#92a6bd" stroke-width="8"/>
<polygon points="2870,1220 2854,1195 2886,1195" fill="#92a6bd"/>
<rect x="2000" y="1230" width="1740" height="265" rx="24" fill="#ffffff" stroke="#7057a3" stroke-width="3"/>
<text x="2036" y="1295" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="43" font-weight="700" fill="#7057a3">B4  CHECKPOINT DAN AUDIT</text>
<text x="2036" y="1361" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Resume memakai run sukses; failure/history tidak menjadi label.</text>
<text x="2036" y="1408" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Audit hash mengunci checkpoint; boundary/data gate sebelum expansion.</text>
<line x1="2870" y1="1505" x2="2870" y2="1530" stroke="#92a6bd" stroke-width="8"/>
<polygon points="2870,1530 2854,1505 2886,1505" fill="#92a6bd"/>
<rect x="2000" y="1540" width="1740" height="265" rx="24" fill="#ffffff" stroke="#7057a3" stroke-width="3"/>
<text x="2036" y="1605" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="43" font-weight="700" fill="#7057a3">B5  COMPARISON OFFLINE</text>
<text x="2036" y="1671" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Prediksi dibuat setelah blind labels terkunci; join disagreement offline.</text>
<text x="2036" y="1718" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="33" font-weight="400" fill="#132d49">Tidak ada anchored review baru; agreement bukan calibrated confidence.</text>
<rect x="100" y="1910" width="3640" height="170" rx="24" fill="#e5f3ee" stroke="#e5f3ee" stroke-width="3"/>
<text x="140" y="1966" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="36" font-weight="700" fill="#157566">CTT / IRT → feedback sistem → retain / collect_more_events / needs_ai_review → versi baru</text>
<text x="140" y="2029" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="34" font-weight="400" fill="#132d49">Parallel-v1 / conditioned-difficulty-v1 adalah legacy ablation. Jawaban siswa mentah bukan teks training.</text>
</svg>