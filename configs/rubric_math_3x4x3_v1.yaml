rubric_version: math-rubric-3x4x3-v1
scope: Matematika SD kelas 1-6
principle: Nilai proses kognitif yang benar-benar diperlukan untuk menyelesaikan soal, bukan kata kerja saja.

mathCognitiveDomain:
  knowing:
    definition: Mengingat, mengenali, membaca, mengurutkan, atau menghitung rutin langsung.
    evidence_required: Tunjukkan fakta atau operasi langsung yang cukup untuk menjawab.
  applying:
    definition: Memilih dan menerapkan konsep atau prosedur yang telah dipelajari pada konteks rutin.
    evidence_required: Tunjukkan pemetaan informasi ke prosedur dan langkah penyelesaian.
  reasoning:
    definition: Menganalisis hubungan, menggeneralisasi, mengevaluasi strategi, atau memberi justifikasi nonrutin.
    evidence_required: Tunjukkan inferensi atau keputusan strategis yang tidak cukup dijelaskan oleh KKO.

knowledgeDimension:
  factual: Fakta, istilah, simbol, dan elemen dasar matematika.
  conceptual: Hubungan antarkonsep, struktur, klasifikasi, dan prinsip.
  procedural: Algoritme, teknik, metode, dan kriteria kapan prosedur digunakan.
  metacognitive: Kesadaran atau evaluasi atas strategi berpikir sendiri; gunakan hanya bila eksplisit dituntut soal.

intendedDifficulty:
  Easy: Sedikit informasi relevan, prosedur langsung, representasi familiar, dan beban langkah rendah.
  Medium: Perlu memilih konsep/prosedur, menghubungkan beberapa informasi, atau beberapa langkah rutin.
  Hard: Banyak batasan, strategi nonlangsung, representasi kompleks, atau penalaran multi-langkah.

review_rules:
  - KKO hanya bukti tambahan; label tidak boleh diputuskan dari KKO saja.
  - Periksa kunci dan tulis solusi minimum sebelum memberi tiga label.
  - Abstain jika visual, notasi, konteks, atau bukti tidak memadai.
  - Reviewer tidak boleh melihat prediksi AI, suara reviewer lain, atau konsensus sebelum suara awal terkunci.
